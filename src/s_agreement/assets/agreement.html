<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-Agreement</title>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/apps/agreement/styles.css">
</head>
<body>
  <div id="toast" class="toast"></div>
  <header>
    <div id="shell"></div>
  </header>
  <main>
    <aside id="organization" aria-label="Organization">
      <h2>Organization</h2>
      <div id="organizationTree"></div>
      <p class="consent-note">
        Joining a parent does not join its subagreements; it makes them
        available. Every parent must be accepted first.
      </p>
    </aside>
    <div class="document-pane">
      <p id="empty">Create or accept an agreement to begin.</p>
      <article id="document"></article>
    </div>
  </main>
  <!-- shared.js binds the confirm dialog's buttons as it loads, so the
       dialog markup has to exist before that script runs. -->
  <dialog id="confirmModal">
    <form method="dialog">
      <h2 id="confirmModalTitle"></h2>
      <p id="confirmModalMessage"></p>
      <menu>
        <button type="button" id="confirmModalCancelBtn">Cancel</button>
        <button type="button" id="confirmModalConfirmBtn" class="danger">Delete</button>
      </menu>
    </form>
  </dialog>
  <script src="/shared-api.js"></script>
  <script src="/shared.js"></script>
  <script>
    const api = SovereignApi.request;
    let current = null;
    let currentInteractionAllowed = false;
    let payloadState = {};
    const nodeStatus = (payload, uuid) => payload.transition_by_node[uuid]?.type;

    // Editing happens in place. An element becomes contenteditable on click,
    // commits on blur or Enter, and reverts on Escape, so there is no modal
    // between a reader and the text they are reading.
    const editable = (element, original, commit) => {
      element.classList.add('editable');
      element.tabIndex = 0;
      const begin = () => {
        if (element.isContentEditable) return;
        element.contentEditable = 'true';
        element.focus();
        const range = document.createRange();
        range.selectNodeContents(element);
        const selection = getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      };
      element.onclick = begin;
      element.onkeydown = (event) => {
        // Not editing yet: Enter or Space begins editing.
        if (!element.isContentEditable) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            begin();
          }
          return;
        }
        // Editing: plain Enter commits; Shift+Enter inserts a line break
        // (the browser's default for a contenteditable), so clauses can hold
        // more than one line. Escape reverts.
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          element.blur();
        } else if (event.key === 'Escape') {
          element.textContent = original;
          element.contentEditable = 'false';
          element.blur();
        }
      };
      element.onblur = async () => {
        element.contentEditable = 'false';
        // innerText, not textContent: it turns the line breaks a contenteditable
        // inserts (as <br>/<div>) back into "\n", which textContent drops.
        const value = element.innerText.replace(/\n+$/, '').trim();
        if (!value || value === original) { element.textContent = original; return; }
        try {
          await commit(value);
          await load();
        } catch (error) {
          element.textContent = original;
          showToast(error.message, true);
        }
      };
      return element;
    };

    // A one-line composer replaces prompt(): it stays in the document flow,
    // so adding a clause reads as writing one.
    const composer = (label, submit) => {
      const row = document.createElement('div');
      row.className = 'composer';
      const input = document.createElement('input');
      input.placeholder = label;
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'Add';
      const send = async () => {
        const value = input.value.trim();
        if (!value) return;
        input.value = '';
        try { await submit(value); await load(); }
        catch (error) { showToast(error.message, true); }
      };
      input.onkeydown = (event) => { if (event.key === 'Enter') send(); };
      button.onclick = send;
      row.append(input, button);
      return row;
    };

    // One row shape for every level of the document:
    //   left   [status] name/text
    //   right  [add subelement]  and, on hover, [react] [delete]
    // React is deliberately not hover-only. Delete is destructive and rare,
    // so hiding it is right; reacting is the only way out of a divergence,
    // and an exit you cannot see is not an exit. It appears whenever there
    // is something to react to and stays hidden otherwise.
    const elementRow = ({node, tag, field, rename, addLabel, onAdd, onDelete,
                         deleteTitle, deleteMessage, index, count, onMove,
                         proposed = false, interactive = true}) => {
      const row = document.createElement('div');
      row.className = 'element-row';
      row.classList.toggle('is-proposed', proposed);
      const transition = payloadState.transition_by_node?.[node.uuid];
      const status = transition?.type && transition.type !== 'in_agreement'
        ? transition.type : 'in_agreement';
      row.dataset.status = status;

      const lamp = document.createElement('span');
      lamp.className = 'status-lamp';
      lamp.dataset.status = status;
      lamp.title = transition ? transitionLabel(transition) : 'In agreement';
      lamp.setAttribute('aria-label', lamp.title);

      const label = document.createElement(tag);
      label.className = 'element-label';
      label.textContent = node.data[field];
      if (rename && !proposed && interactive) {
        editable(label, node.data[field], rename);
      }

      const actions = document.createElement('span');
      actions.className = 'element-actions';
      if (proposed) {
        const badge = document.createElement('span');
        badge.className = 'proposal-badge';
        badge.textContent = 'Proposed';
        actions.append(badge);
      }

      // Reorder among siblings. Up/down rather than drag: unambiguous, works
      // by keyboard, and does not fight the click-to-edit on the text itself.
      if (interactive && onMove) {
        const up = document.createElement('button');
        up.type = 'button';
        up.className = 'element-move';
        up.textContent = '↑';
        up.title = 'Move up';
        up.disabled = index === 0;
        up.onclick = () => onMove(index - 1);
        const down = document.createElement('button');
        down.type = 'button';
        down.className = 'element-move';
        down.textContent = '↓';
        down.title = 'Move down';
        down.disabled = index === count - 1;
        down.onclick = () => onMove(index + 1);
        actions.append(up, down);
      }

      if (interactive && onAdd) {
        const add = document.createElement('button');
        add.type = 'button';
        add.className = 'element-add';
        add.textContent = addLabel;
        add.title = addLabel;
        add.onclick = onAdd;
        actions.append(add);
      }

      if (interactive
          && transition
          && !['in_agreement', 'in_transition'].includes(transition.type)
          && transition.peer_addr) {
        const react = document.createElement('button');
        react.type = 'button';
        react.className = 'element-react';
        const sourceType = transition.original_type || transition.type;
        const rollback = transition.reaction === 'rollback';
        const peerMissing = sourceType === 'peer_missing_node';
        const withdraw = rollback && peerMissing;
        const acceptRemoval = !rollback && peerMissing;
        react.textContent = withdraw
          ? 'Withdraw proposal'
          : (acceptRemoval
            ? 'Accept removal'
          : (rollback
            ? 'Revert mine'
            : (sourceType === 'local_missing_node'
              ? 'Accept proposal' : 'Take theirs')));
        react.title = transitionLabel(transition);
        react.onclick = async () => {
          try {
            await api('/api/agreement/react', {
              node_uuid: node.uuid,
              source_addr: transition.peer_addr,
              reaction: transition.reaction || 'adopt',
              absent: peerMissing,
            });
            await load();
            showToast(withdraw
              ? 'Proposal withdrawn'
              : (rollback
                ? 'Reverted your change'
                : (acceptRemoval ? 'Removal accepted' : 'Accepted their version')));
          } catch (error) { showToast(error.message, true); }
        };
        actions.append(react);
      }

      if (interactive && onDelete) {
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'element-delete';
        remove.textContent = 'Delete';
        remove.title = 'Delete';
        remove.onclick = () => {
          document.querySelector('#confirmModalConfirmBtn').textContent = 'Delete';
          confirmAction(deleteTitle, deleteMessage, onDelete);
        };
        actions.append(remove);
      }

      row.append(lamp, label, actions);
      return row;
    };

    // Live children in display order. Mirrors Session._ordered_children: an
    // explicit "order" wins, otherwise the node keeps its position in the
    // payload (which is creation order), so items pre-dating ordering still
    // sort sensibly.
    const ordered = (children) => (children || [])
      .filter(node => !node.deleted)
      .map((node, position) => [node, node.data.order ?? position])
      .sort((a, b) => a[1] - b[1])
      .map(pair => pair[0]);

    const proposedChildren = (parentUuid) => (payloadState.proposed_nodes || [])
      .map(entry => entry.node)
      .filter(node => !node.deleted && node.parent_uuid === parentUuid);

    const displayedChildren = (parent, nodeType, inheritedProposal = false) => {
      const entries = ordered(parent.children)
        .filter(node => node.data.type === nodeType)
        .map(node => ({node, proposed: inheritedProposal}));
      if (!inheritedProposal) {
        const present = new Set(entries.map(entry => entry.node.uuid));
        for (const node of proposedChildren(parent.uuid)) {
          if (node.data.type === nodeType && !present.has(node.uuid)) {
            entries.push({node, proposed: true});
          }
        }
      }
      return entries
        .map((entry, position) => [
          entry, entry.node.data.order ?? position,
        ])
        .sort((a, b) => a[1] - b[1])
        .map(pair => pair[0]);
    };

    const selectAgreement = async (agreementUuid) => {
      await api('/api/agreement/agreements/select',
        {agreement_uuid: agreementUuid});
      await load();
    };

    const renderOrganization = (organization) => {
      const tree = document.querySelector('#organizationTree');
      tree.replaceChildren();
      const renderNode = (item, depth = 0) => {
        const branch = document.createElement('div');
        branch.className = 'organization-branch';
        branch.style.setProperty('--depth', depth);
        const row = document.createElement('div');
        row.className = 'organization-row';
        row.classList.toggle('is-current', item.uuid === current?.uuid);
        row.classList.toggle('is-restricted', !item.joined);
        row.classList.toggle(
          'is-readonly', item.joined && !item.interaction_allowed,
        );

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'organization-name';
        button.textContent = item.title;
        button.disabled = !item.joined;
        button.title = item.joined
          ? (
            item.interaction_allowed
              ? `Open ${item.title}`
              : `Open ${item.title} read-only`
          )
          : 'This subagreement has separate membership';
        if (item.joined) button.onclick = () => selectAgreement(item.uuid);

        const count = document.createElement('span');
        count.className = 'member-count';
        count.textContent = item.joined
          ? `${(item.members || []).length} ${(item.members || []).length === 1 ? 'person' : 'people'}`
          : 'Not joined';
        row.append(button, count);
        if (item.relationship_status === 'awaiting_parent_agreement') {
          const pending = document.createElement('span');
          pending.className = 'relationship-pending';
          pending.textContent = 'Parent link pending';
          row.append(pending);
        }
        branch.append(row);
        for (const child of item.children || []) {
          branch.append(renderNode(child, depth + 1));
        }
        return branch;
      };
      for (const root of organization?.roots || []) {
        tree.append(renderNode(root));
      }
      if (!tree.children.length) {
        const empty = document.createElement('p');
        empty.className = 'organization-empty';
        empty.textContent = 'No agreements yet';
        tree.append(empty);
      }
    };

    const renderAcceptances = (
      acceptances, interactive, refusalConsequences,
    ) => {
      const section = document.createElement('section');
      section.className = 'acceptance-panel';
      const heading = document.createElement('div');
      heading.className = 'acceptance-heading';
      const title = document.createElement('h3');
      title.textContent = 'Acceptance';
      const reference = document.createElement('p');
      reference.textContent = 'Each decision is bound to this version of the agreement.';
      heading.append(title, reference);
      section.append(heading);

      const badges = document.createElement('div');
      badges.className = 'acceptance-badges';
      const statusLabels = {
        accepted: 'Accepted',
        refused: 'Refused',
        pending: 'No decision',
        expired: 'Expired',
        outdated: 'Needs renewal',
      };
      for (const item of acceptances || []) {
        const badge = document.createElement('div');
        badge.className = 'acceptance-badge';
        badge.dataset.status = item.status;
        if (item.picture) {
          const avatar = document.createElement('img');
          avatar.className = 'acceptance-avatar';
          avatar.src = item.picture;
          avatar.alt = '';
          badge.append(avatar);
        } else {
          const avatar = document.createElement('span');
          avatar.className = 'acceptance-avatar acceptance-initials';
          avatar.textContent = (item.name || '?').trim().slice(0, 1).toUpperCase();
          badge.append(avatar);
        }
        const body = document.createElement('span');
        body.className = 'acceptance-body';
        const name = document.createElement('strong');
        name.textContent = item.is_self ? `${item.name} (you)` : item.name;
        const status = document.createElement('span');
        status.className = 'acceptance-status';
        status.textContent = statusLabels[item.status] || item.status;
        body.append(name, status);
        if (item.decided_at) {
          const details = document.createElement('span');
          details.className = 'acceptance-details';
          const decided = new Date(item.decided_at).toLocaleString();
          const expiry = item.expires_at
            ? `expires ${new Date(item.expires_at).toLocaleString()}`
            : 'no expiration';
          const hash = item.reference_hash || '';
          details.textContent = `${decided} · ${expiry} · ${hash.slice(0, 19)}…`;
          details.title = hash;
          badge.title = (
            `${statusLabels[item.status] || item.status} · ${decided} · `
            + `${expiry} · ${hash}`
          );
          body.append(details);
        }
        badge.append(body);
        badges.append(badge);
      }
      section.append(badges);

      const controls = document.createElement('div');
      controls.className = 'acceptance-controls';
      const expiryLabel = document.createElement('label');
      expiryLabel.textContent = 'Expiration';
      const expiryInput = document.createElement('input');
      expiryInput.type = 'datetime-local';
      expiryInput.setAttribute('aria-label', 'Acceptance expiration');
      expiryLabel.append(expiryInput);
      const decide = async decision => {
        const expiresAt = expiryInput.value
          ? new Date(expiryInput.value).toISOString()
          : null;
        try {
          await api('/api/agreement/agreements/decision', {
            agreement_uuid: current.uuid,
            decision,
            expires_at: expiresAt,
          });
          await load();
          showToast(decision === 'accepted'
            ? 'Agreement accepted' : 'Agreement refused');
        } catch (error) { showToast(error.message, true); }
      };
      const accept = document.createElement('button');
      accept.type = 'button';
      accept.className = 'decision-accept';
      accept.textContent = 'Accept current version';
      accept.onclick = () => decide('accepted');
      const refuse = document.createElement('button');
      refuse.type = 'button';
      refuse.className = 'decision-refuse';
      refuse.textContent = 'Refuse';
      const consequenceNames = (refusalConsequences || [])
        .map(item => item.title);
      const consequenceDescription = consequenceNames.length
        ? (
          `This will also mark ${consequenceNames.length} joined `
          + `subagreement${consequenceNames.length === 1 ? '' : 's'} as refused: `
          + `${consequenceNames.join(', ')}. They remain visible, but cannot be `
          + 'changed until every parent is accepted again. Each descendant '
          + 'must then be accepted again separately.'
        )
        : (
          'Any subagreements remain visible, but cannot be changed until '
          + 'this agreement is accepted again.'
        );
      refuse.onclick = () => {
        document.querySelector('#confirmModalConfirmBtn').textContent = 'Refuse';
        confirmAction(
          'Refuse this agreement?',
          consequenceDescription,
          () => decide('refused'),
        );
      };
      controls.append(expiryLabel, accept, refuse);
      const content = document.createElement('div');
      content.className = 'acceptance-content';
      content.append(badges);
      if (interactive) content.append(controls);
      section.append(content);
      return section;
    };

    const findDisplayedNode = (uuid) => {
      const roots = [
        current,
        ...(payloadState.proposed_nodes || []).map(entry => entry.node),
      ].filter(Boolean);
      const pending = [...roots];
      const seen = new Set();
      while (pending.length) {
        const node = pending.pop();
        if (!node || seen.has(node.uuid)) continue;
        if (node.uuid === uuid) return node;
        seen.add(node.uuid);
        pending.push(...(node.children || []));
      }
      return null;
    };

    // Accountabilities and domains differ only in what they are called, so
    // one card renders both columns from this table.
    const ROLE_ITEM_KINDS = [
      {
        kind: 'accountability', type: 'agreement_accountability',
        label: 'Accountabilities', add: 'New accountability',
      },
      {
        kind: 'domain', type: 'agreement_domain',
        label: 'Domains', add: 'New domain',
      },
    ];

    const renderRoleCard = ({role, proposed, index, count, interactive,
                             movable}) => {
      const card = document.createElement('article');
      card.className = 'role-card';
      card.classList.toggle('is-proposed', proposed);

      card.append(elementRow({
        node: role,
        tag: 'h4',
        field: 'name',
        rename: value => api('/api/agreement/roles/rename',
          {role_uuid: role.uuid, name: value}),
        proposed,
        interactive,
        index,
        count,
        onMove: movable ? async newIndex => {
          try {
            await api('/api/agreement/roles/move',
              {role_uuid: role.uuid, index: newIndex});
            await load();
          } catch (error) { showToast(error.message, true); }
        } : null,
        onDelete: interactive ? async () => {
          try {
            await api('/api/agreement/roles/delete', {role_uuid: role.uuid});
            await load();
          } catch (error) { showToast(error.message, true); }
        } : null,
        deleteTitle: 'Delete this role?',
        deleteMessage:
          'Its accountabilities and domains go with it. This cannot be undone.',
      }));

      // An unset purpose is a genuinely empty element - the prompt is a CSS
      // pseudo-element, so it can never be committed as the value.
      const purpose = document.createElement('p');
      purpose.className = 'role-purpose';
      purpose.textContent = role.data.purpose || '';
      if (interactive) {
        editable(purpose, role.data.purpose || '', value =>
          api('/api/agreement/roles/set_purpose',
            {role_uuid: role.uuid, purpose: value}));
      }
      card.append(purpose);

      const columns = document.createElement('div');
      columns.className = 'role-columns';
      for (const {kind, type, label, add} of ROLE_ITEM_KINDS) {
        const column = document.createElement('div');
        column.className = 'role-column';
        const columnTitle = document.createElement('h5');
        columnTitle.textContent = label;
        column.append(columnTitle);
        const items = displayedChildren(role, type, proposed);
        const itemsHaveProposals = items.some(entry => entry.proposed);
        items.forEach(({node: item, proposed: itemProposed}, itemIndex) => {
          column.append(elementRow({
            node: item,
            tag: 'p',
            field: 'text',
            rename: value => api('/api/agreement/roles/items/update',
              {item_uuid: item.uuid, text: value}),
            proposed: itemProposed,
            interactive: interactive && !itemProposed,
            index: itemIndex,
            count: items.length,
            onMove: (!interactive || itemProposed || itemsHaveProposals)
              ? null
              : async newIndex => {
                try {
                  await api('/api/agreement/roles/items/move',
                    {item_uuid: item.uuid, index: newIndex});
                  await load();
                } catch (error) { showToast(error.message, true); }
              },
            onDelete: interactive && !itemProposed ? async () => {
              try {
                await api('/api/agreement/roles/items/delete',
                  {item_uuid: item.uuid});
                await load();
              } catch (error) { showToast(error.message, true); }
            } : null,
            deleteTitle: `Delete this ${kind}?`,
            deleteMessage: 'This cannot be undone.',
          }));
        });
        if (interactive) {
          column.append(composer(add, async text => {
            await api('/api/agreement/roles/items/create',
              {role_uuid: role.uuid, kind, text});
          }));
        }
        columns.append(column);
      }
      card.append(columns);
      return card;
    };

    // Roles are content, not administration. They render inside the document
    // rather than in a side panel, because a role is part of what people
    // accept - but as cards rather than prose, because they are structured.
    const renderRoles = (agreement, interactive) => {
      const section = document.createElement('section');
      section.className = 'roles';
      const sectionHeading = document.createElement('div');
      sectionHeading.className = 'roles-heading';
      const title = document.createElement('h3');
      title.textContent = 'Roles';
      const explanation = document.createElement('p');
      explanation.textContent =
        'What this agreement expects, and of whom.';
      sectionHeading.append(title, explanation);
      section.append(sectionHeading);

      const roles = displayedChildren(agreement, 'agreement_role');
      const rolesHaveProposals = roles.some(entry => entry.proposed);
      roles.forEach(({node: role, proposed}, index) => {
        section.append(renderRoleCard({
          role,
          proposed,
          index,
          count: roles.length,
          interactive: interactive && !proposed,
          movable: interactive && !proposed && !rolesHaveProposals,
        }));
      });
      if (!roles.length) {
        const empty = document.createElement('p');
        empty.className = 'roles-empty';
        empty.textContent = 'No roles yet.';
        section.append(empty);
      }
      if (interactive) {
        section.append(composer('New role name', async name => {
          await api('/api/agreement/roles/create',
            {agreement_uuid: agreement.uuid, name});
        }));
      }
      return section;
    };

    // The document is rebuilt wholesale on every poll. That stays - it is
    // cheap at this size and needs no second render path - but an unchanged
    // payload should cost nothing. Recorded only once the document is
    // actually rebuilt, so a render skipped by the edit guard below is
    // retried on the next poll instead of being lost.
    let renderedPayloadJson = '';

    const render = (payload) => {
      const encoded = JSON.stringify(payload);
      if (encoded === renderedPayloadJson) { SovereignShell.refresh(); return; }
      payloadState = payload;
      current = payload.agreement;
      currentInteractionAllowed = Boolean(payload.interaction?.allowed);
      renderOrganization(payload.organization);
      SovereignShell.setTopicSelector({
        label: 'Agreement',
        topics: payload.agreements.map(item => ({
          uuid: item.uuid,
          title: item.data.title || 'Untitled agreement',
        })),
        selectedUuid: current?.uuid || '',
        onSelect: selectAgreement,
        onRename: current && currentInteractionAllowed ? async title => {
          await api('/api/agreement/agreements/rename',
            {agreement_uuid: current.uuid, title});
          await load();
        } : null,
      });
      document.querySelector('#empty').hidden = Boolean(current);

      const article = document.querySelector('#document');
      // Never rebuild the document while it is being edited, or the caret
      // is destroyed mid-word by the poll.
      if (article.contains(document.activeElement)
        && (
          document.activeElement.isContentEditable
          || document.activeElement.matches('input, textarea, select')
        )) {
        SovereignShell.refresh();
        return;
      }
      renderedPayloadJson = encoded;
      article.replaceChildren();
      article.classList.toggle('is-readonly', !currentInteractionAllowed);
      if (!current) { SovereignShell.refresh(); return; }

      article.append(elementRow({
        node: current,
        tag: 'h2',
        field: 'title',
        rename: value => api('/api/agreement/agreements/rename',
          {agreement_uuid: current.uuid, title: value}),
        addLabel: '+ Section',
        onAdd: async () => {
          try {
            await api('/api/agreement/sections/create',
              {agreement_uuid: current.uuid, title: 'Untitled section'});
            await load();
          } catch (error) { showToast(error.message, true); }
        },
        interactive: currentInteractionAllowed,
      }));
      if (!currentInteractionAllowed) {
        const notice = document.createElement('p');
        notice.className = 'readonly-notice';
        notice.textContent = (
          payload.interaction?.reason
          || 'This subagreement is visible but read-only.'
        );
        article.append(notice);
      }
      article.append(renderAcceptances(
        payload.acceptances,
        currentInteractionAllowed,
        payload.refusal_consequences,
      ));

      const subagreements = displayedChildren(current, 'agreement_link');
      const organizationSection = document.createElement('section');
      organizationSection.className = 'subagreements';
      const organizationHeading = document.createElement('div');
      organizationHeading.className = 'subagreement-heading';
      const heading = document.createElement('h3');
      heading.textContent = 'Subagreements';
      const explanation = document.createElement('p');
      explanation.textContent = (
        'Create a separate agreement, then invite only the people who should join it.'
      );
      organizationHeading.append(heading, explanation);
      organizationSection.append(organizationHeading);
      for (const {node: link, proposed} of subagreements) {
        const row = elementRow({
          node: link,
          tag: 'p',
          field: 'title',
          proposed,
          interactive: currentInteractionAllowed,
        });
        const linked = payload.agreements.some(
          agreement => agreement.uuid === link.data.child_agreement_uuid,
        );
        const label = row.querySelector('.element-label');
        if (linked && !proposed) {
          label.classList.add('agreement-link');
          label.tabIndex = 0;
          label.title = 'Open subagreement';
          label.onclick = () => selectAgreement(
            link.data.child_agreement_uuid,
          );
          label.onkeydown = event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              selectAgreement(link.data.child_agreement_uuid);
            }
          };
        } else if (!proposed) {
          const restricted = document.createElement('span');
          restricted.className = 'restricted-badge';
          restricted.textContent = 'Separate membership';
          row.querySelector('.element-actions').append(restricted);
        }
        organizationSection.append(row);
      }
      const ownAcceptance = (payload.acceptances || []).find(item => item.is_self);
      if (
        currentInteractionAllowed
        && ownAcceptance?.status === 'accepted'
      ) {
        organizationSection.append(composer('New subagreement name', async title => {
          await api('/api/agreement/agreements/create_subagreement', {
            parent_agreement_uuid: current.uuid,
            title,
          });
        }));
      } else if (currentInteractionAllowed) {
        const prerequisite = document.createElement('p');
        prerequisite.className = 'subagreement-prerequisite';
        prerequisite.textContent = (
          'Accept the current agreement version before creating a subagreement.'
        );
        organizationSection.append(prerequisite);
      }
      article.append(organizationSection);

      const sections = displayedChildren(current, 'agreement_section');
      const sectionsHaveProposals = sections.some(entry => entry.proposed);
      sections.forEach(({node: section, proposed}, sIndex) => {
        const block = document.createElement('section');
        block.append(elementRow({
          node: section,
          tag: 'h3',
          field: 'title',
          proposed,
          interactive: currentInteractionAllowed,
          rename: proposed ? null : value => api(
            '/api/agreement/sections/rename',
            {section_uuid: section.uuid, title: value},
          ),
          addLabel: '+ Clause',
          onAdd: proposed ? null : async () => {
            try {
              await api('/api/agreement/clauses/create',
                {section_uuid: section.uuid, text: 'New clause'});
              await load();
            } catch (error) { showToast(error.message, true); }
          },
          onDelete: proposed ? null : async () => {
            try {
              await api('/api/agreement/sections/delete', {section_uuid: section.uuid});
              await load();
            } catch (error) { showToast(error.message, true); }
          },
          deleteTitle: 'Delete this section?',
          deleteMessage: 'Its clauses are deleted with it. This cannot be undone.',
          index: sIndex,
          count: sections.length,
          onMove: proposed || sectionsHaveProposals ? null : async newIndex => {
            try {
              await api('/api/agreement/sections/move',
                {section_uuid: section.uuid, index: newIndex});
              await load();
            } catch (error) { showToast(error.message, true); }
          },
        }));

        const clauses = displayedChildren(
          section, 'agreement_clause', proposed,
        );
        const clausesHaveProposals = clauses.some(entry => entry.proposed);
        clauses.forEach(({node: clause, proposed: clauseProposed}, cIndex) => {
          block.append(elementRow({
            node: clause,
            tag: 'p',
            field: 'text',
            proposed: clauseProposed,
            interactive: currentInteractionAllowed,
            rename: clauseProposed ? null : value => api(
              '/api/agreement/clauses/update',
              {clause_uuid: clause.uuid, text: value},
            ),
            onDelete: clauseProposed ? null : async () => {
              try {
                await api('/api/agreement/clauses/delete', {clause_uuid: clause.uuid});
                await load();
              } catch (error) { showToast(error.message, true); }
            },
            deleteTitle: 'Delete this clause?',
            deleteMessage: 'This cannot be undone.',
            index: cIndex,
            count: clauses.length,
            onMove: clauseProposed || clausesHaveProposals ? null : async newIndex => {
              try {
                await api('/api/agreement/clauses/move',
                  {clause_uuid: clause.uuid, index: newIndex});
                await load();
              } catch (error) { showToast(error.message, true); }
            },
          }));
        });
        article.append(block);
      });
      article.append(renderRoles(current, currentInteractionAllowed));
      SovereignShell.refresh();
    };

    const load = async () => render(await api('/api/agreement/document'));

    SovereignShell.mount({
      container: document.querySelector('#shell'),
      applicationId: 'agreement',
      topicUuid: () => (
        currentInteractionAllowed ? (current?.uuid || '') : ''
      ),
      state: () => payloadState,
      onChanged: () => load(),
      agendaRoutes: {
        topicKey: 'agreement_uuid',
        create: '/api/agreement/agenda/create',
        delete: '/api/agreement/agenda/delete',
        setPriority: '/api/agreement/agenda/set_priority',
        move: '/api/agreement/agenda/move',
      },
      // Name a node so the disagreement pane can say which clause or section
      // is unsettled, rather than showing a bare uuid.
      describeNode: (uuid) => {
        const node = findDisplayedNode(uuid);
        return node
          ? (node.data.title || node.data.text || '').slice(0, 60)
          : '';
      },
    });

    // Deep link from the overview: /apps/agreement?agreement=<uuid> selects
    // that agreement on arrival, mirroring Kanban's ?board=<uuid>.
    async function selectAgreementFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const uuid = params.get('agreement');
      if (!uuid) return;
      try {
        await api('/api/agreement/agreements/select', {agreement_uuid: uuid});
      } catch (error) { showToast(error.message, true); }
      params.delete('agreement');
      const query = params.toString();
      window.history.replaceState({}, '', window.location.pathname + (query ? `?${query}` : ''));
    }

    selectAgreementFromUrl().then(load);
    setInterval(load, 3000);
  </script>
</body>
</html>
