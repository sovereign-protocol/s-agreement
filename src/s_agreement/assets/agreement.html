<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-Agreement</title>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/apps/agreement/styles.css">
</head>
<body>
  <div id="toast" class="toast"></div>
  <header>
    <div id="shell"></div>
  </header>
  <main>
    <!-- The topic switcher. SovereignShell.setTopicRegion moves it into the
         header at mount; it lives here only so the markup owns it. -->
    <select id="agreements" aria-label="Agreement"></select>
    <p id="empty">Create or accept an agreement to begin.</p>
    <article id="document"></article>
  </main>
  <!-- shared.js binds the confirm dialog's buttons as it loads, so the
       dialog markup has to exist before that script runs. -->
  <dialog id="confirmModal">
    <form method="dialog">
      <h2 id="confirmModalTitle"></h2>
      <p id="confirmModalMessage"></p>
      <menu>
        <button type="button" id="confirmModalCancelBtn">Cancel</button>
        <button type="button" id="confirmModalConfirmBtn" class="danger">Delete</button>
      </menu>
    </form>
  </dialog>
  <script src="/shared.js"></script>
  <script>
    const api = async (path, body) => {
      const response = await fetch(path, body ? {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      } : {});
      const value = await response.json();
      if (!response.ok) throw new Error(value.reason || 'Request failed');
      return value;
    };
    let current = null;
    let payloadState = {};
    const nodeStatus = (payload, uuid) => payload.transition_by_node[uuid]?.type;

    // Editing happens in place. An element becomes contenteditable on click,
    // commits on blur or Enter, and reverts on Escape, so there is no modal
    // between a reader and the text they are reading.
    const editable = (element, original, commit) => {
      element.classList.add('editable');
      element.tabIndex = 0;
      const begin = () => {
        if (element.isContentEditable) return;
        element.contentEditable = 'true';
        element.focus();
        const range = document.createRange();
        range.selectNodeContents(element);
        const selection = getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      };
      element.onclick = begin;
      element.onkeydown = (event) => {
        // Not editing yet: Enter or Space begins editing.
        if (!element.isContentEditable) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            begin();
          }
          return;
        }
        // Editing: plain Enter commits; Shift+Enter inserts a line break
        // (the browser's default for a contenteditable), so clauses can hold
        // more than one line. Escape reverts.
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          element.blur();
        } else if (event.key === 'Escape') {
          element.textContent = original;
          element.contentEditable = 'false';
          element.blur();
        }
      };
      element.onblur = async () => {
        element.contentEditable = 'false';
        // innerText, not textContent: it turns the line breaks a contenteditable
        // inserts (as <br>/<div>) back into "\n", which textContent drops.
        const value = element.innerText.replace(/\n+$/, '').trim();
        if (!value || value === original) { element.textContent = original; return; }
        try {
          await commit(value);
          await load();
        } catch (error) {
          element.textContent = original;
          showToast(error.message, true);
        }
      };
      return element;
    };

    // A one-line composer replaces prompt(): it stays in the document flow,
    // so adding a clause reads as writing one.
    const composer = (label, submit) => {
      const row = document.createElement('div');
      row.className = 'composer';
      const input = document.createElement('input');
      input.placeholder = label;
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'Add';
      const send = async () => {
        const value = input.value.trim();
        if (!value) return;
        input.value = '';
        try { await submit(value); await load(); }
        catch (error) { showToast(error.message, true); }
      };
      input.onkeydown = (event) => { if (event.key === 'Enter') send(); };
      button.onclick = send;
      row.append(input, button);
      return row;
    };

    // One row shape for every level of the document:
    //   left   [status] name/text
    //   right  [add subelement]  and, on hover, [react] [delete]
    // React is deliberately not hover-only. Delete is destructive and rare,
    // so hiding it is right; reacting is the only way out of a divergence,
    // and an exit you cannot see is not an exit. It appears whenever there
    // is something to react to and stays hidden otherwise.
    const elementRow = ({node, tag, field, rename, addLabel, onAdd, onDelete,
                         deleteTitle, deleteMessage, index, count, onMove}) => {
      const row = document.createElement('div');
      row.className = 'element-row';
      const transition = payloadState.transition_by_node?.[node.uuid];
      const status = transition?.type && transition.type !== 'in_agreement'
        ? transition.type : 'in_agreement';
      row.dataset.status = status;

      const lamp = document.createElement('span');
      lamp.className = 'status-lamp';
      lamp.dataset.status = status;
      lamp.title = transition ? transitionLabel(transition) : 'In agreement';
      lamp.setAttribute('aria-label', lamp.title);

      const label = document.createElement(tag);
      label.className = 'element-label';
      label.textContent = node.data[field];
      editable(label, node.data[field], rename);

      const actions = document.createElement('span');
      actions.className = 'element-actions';

      // Reorder among siblings. Up/down rather than drag: unambiguous, works
      // by keyboard, and does not fight the click-to-edit on the text itself.
      if (onMove) {
        const up = document.createElement('button');
        up.type = 'button';
        up.className = 'element-move';
        up.textContent = '↑';
        up.title = 'Move up';
        up.disabled = index === 0;
        up.onclick = () => onMove(index - 1);
        const down = document.createElement('button');
        down.type = 'button';
        down.className = 'element-move';
        down.textContent = '↓';
        down.title = 'Move down';
        down.disabled = index === count - 1;
        down.onclick = () => onMove(index + 1);
        actions.append(up, down);
      }

      if (onAdd) {
        const add = document.createElement('button');
        add.type = 'button';
        add.className = 'element-add';
        add.textContent = addLabel;
        add.title = addLabel;
        add.onclick = onAdd;
        actions.append(add);
      }

      if (transition && transition.type !== 'in_agreement' && transition.peer_addr) {
        const react = document.createElement('button');
        react.type = 'button';
        react.className = 'element-react';
        react.textContent = transition.reaction === 'rollback' ? 'Keep mine' : 'Take theirs';
        react.title = transitionLabel(transition);
        react.onclick = async () => {
          try {
            await api('/api/agreement/react', {
              node_uuid: node.uuid,
              source_addr: transition.peer_addr,
              reaction: transition.reaction || 'adopt',
            });
            await load();
            showToast(transition.reaction === 'rollback'
              ? 'Kept your version' : 'Took their version');
          } catch (error) { showToast(error.message, true); }
        };
        actions.append(react);
      }

      if (onDelete) {
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'element-delete';
        remove.textContent = 'Delete';
        remove.title = 'Delete';
        remove.onclick = () => confirmAction(deleteTitle, deleteMessage, onDelete);
        actions.append(remove);
      }

      row.append(lamp, label, actions);
      return row;
    };

    // Live children in display order. Mirrors Session._ordered_children: an
    // explicit "order" wins, otherwise the node keeps its position in the
    // payload (which is creation order), so items pre-dating ordering still
    // sort sensibly.
    const ordered = (children) => (children || [])
      .filter(node => !node.deleted)
      .map((node, position) => [node, node.data.order ?? position])
      .sort((a, b) => a[1] - b[1])
      .map(pair => pair[0]);

    const render = (payload) => {
      payloadState = payload;
      current = payload.agreement;
      const select = document.querySelector('#agreements');
      const wanted = payload.agreements.map(item => [item.uuid, item.data.title]);
      const shown = [...select.options].map(option => [option.value, option.textContent]);
      const same = shown.length === wanted.length
        && wanted.every((pair, index) => shown[index][0] === pair[0] && shown[index][1] === pair[1]);
      if (!same && document.activeElement !== select) {
        select.replaceChildren(...wanted.map(pair => {
          const option = document.createElement('option');
          option.value = pair[0];
          option.textContent = pair[1];
          return option;
        }));
      }
      if (document.activeElement !== select) select.value = current?.uuid || '';
      document.querySelector('#empty').hidden = Boolean(current);

      const article = document.querySelector('#document');
      // Never rebuild the document while it is being edited, or the caret
      // is destroyed mid-word by the poll.
      if (article.contains(document.activeElement)
        && document.activeElement.isContentEditable) {
        SovereignShell.refresh();
        return;
      }
      article.replaceChildren();
      if (!current) { SovereignShell.refresh(); return; }

      article.append(elementRow({
        node: current,
        tag: 'h2',
        field: 'title',
        rename: value => api('/api/agreement/agreements/rename',
          {agreement_uuid: current.uuid, title: value}),
        addLabel: '+ Section',
        onAdd: async () => {
          try {
            await api('/api/agreement/sections/create',
              {agreement_uuid: current.uuid, title: 'Untitled section'});
            await load();
          } catch (error) { showToast(error.message, true); }
        },
      }));

      const sections = ordered(current.children);
      sections.forEach((section, sIndex) => {
        const block = document.createElement('section');
        block.append(elementRow({
          node: section,
          tag: 'h3',
          field: 'title',
          rename: value => api('/api/agreement/sections/rename',
            {section_uuid: section.uuid, title: value}),
          addLabel: '+ Clause',
          onAdd: async () => {
            try {
              await api('/api/agreement/clauses/create',
                {section_uuid: section.uuid, text: 'New clause'});
              await load();
            } catch (error) { showToast(error.message, true); }
          },
          onDelete: async () => {
            try {
              await api('/api/agreement/sections/delete', {section_uuid: section.uuid});
              await load();
            } catch (error) { showToast(error.message, true); }
          },
          deleteTitle: 'Delete this section?',
          deleteMessage: 'Its clauses are deleted with it. This cannot be undone.',
          index: sIndex,
          count: sections.length,
          onMove: async newIndex => {
            try {
              await api('/api/agreement/sections/move',
                {section_uuid: section.uuid, index: newIndex});
              await load();
            } catch (error) { showToast(error.message, true); }
          },
        }));

        const clauses = ordered(section.children);
        clauses.forEach((clause, cIndex) => {
          block.append(elementRow({
            node: clause,
            tag: 'p',
            field: 'text',
            rename: value => api('/api/agreement/clauses/update',
              {clause_uuid: clause.uuid, text: value}),
            onDelete: async () => {
              try {
                await api('/api/agreement/clauses/delete', {clause_uuid: clause.uuid});
                await load();
              } catch (error) { showToast(error.message, true); }
            },
            deleteTitle: 'Delete this clause?',
            deleteMessage: 'This cannot be undone.',
            index: cIndex,
            count: clauses.length,
            onMove: async newIndex => {
              try {
                await api('/api/agreement/clauses/move',
                  {clause_uuid: clause.uuid, index: newIndex});
                await load();
              } catch (error) { showToast(error.message, true); }
            },
          }));
        });
        article.append(block);
      });
      SovereignShell.refresh();
    };

    const load = async () => render(await api('/api/agreement/document'));

    document.querySelector('#agreements').onchange = async event => {
      await api('/api/agreement/agreements/select', {agreement_uuid: event.target.value});
      await load();
    };

    SovereignShell.mount({
      container: document.querySelector('#shell'),
      applicationId: 'agreement',
      topicUuid: () => current?.uuid || '',
      state: () => payloadState,
      onChanged: () => load(),
      agendaRoutes: {
        topicKey: 'agreement_uuid',
        create: '/api/agreement/agenda/create',
        delete: '/api/agreement/agenda/delete',
        setPriority: '/api/agreement/agenda/set_priority',
      },
      onCreateTopic: async () => {
        try {
          await api('/api/agreement/agreements/create', {title: 'Untitled agreement'});
          await load();
          showToast('Agreement created - click its title to rename it');
        } catch (error) { showToast(error.message, true); }
      },
      // Agreement has no user model of its own, but Core resolves an address
      // to an identity for the connected-peers list. Match on address, since
      // network peers are keyed that way.
      describePeer: (addr) => {
        const known = (payloadState.known_identities || [])
          .find((entry) => entry.address === addr);
        return known
          ? { label: known.name || addr, picture: known.picture || "" }
          : { label: addr };
      },
      // Name a node so the disagreement pane can say which clause or section
      // is unsettled, rather than showing a bare uuid.
      describeNode: (uuid) => {
        if (!current) return '';
        if (uuid === current.uuid) return current.data.title;
        for (const section of current.children || []) {
          if (section.uuid === uuid) return section.data.title;
          for (const clause of section.children || []) {
            if (clause.uuid === uuid) return (clause.data.text || '').slice(0, 60);
          }
        }
        return '';
      },
    });
    // The agreement picker is this application's topic control until Core
    // owns topic selection. Putting it in the shell's topic region keeps one
    // header layout across applications.
    SovereignShell.setTopicRegion(document.querySelector('#agreements'));

    // Deep link from the overview: /apps/agreement?agreement=<uuid> selects
    // that agreement on arrival, mirroring Kanban's ?board=<uuid>.
    async function selectAgreementFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const uuid = params.get('agreement');
      if (!uuid) return;
      try {
        await api('/api/agreement/agreements/select', {agreement_uuid: uuid});
      } catch (error) { showToast(error.message, true); }
      params.delete('agreement');
      const query = params.toString();
      window.history.replaceState({}, '', window.location.pathname + (query ? `?${query}` : ''));
    }

    selectAgreementFromUrl().then(load);
    setInterval(load, 3000);
  </script>
</body>
</html>
