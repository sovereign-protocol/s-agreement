<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-Agreement</title>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/apps/agreement/styles.css">
</head>
<body>
  <div id="toast" class="toast"></div>
  <header>
    <div id="shell"></div>
  </header>
  <main>
    <aside id="organization" aria-label="Organization">
      <h2>Organization</h2>
      <div id="organizationTree"></div>
      <p class="consent-note">
        Joining a parent does not join its subagreements; it makes them
        available. A role must be held in every parent first.
      </p>
    </aside>
    <div class="document-pane">
      <p id="empty">Create or accept an agreement to begin.</p>
      <article id="document"></article>
    </div>
  </main>
  <!-- shared.js binds the confirm dialog's buttons as it loads, so the
       dialog markup has to exist before that script runs. -->
  <dialog id="confirmModal">
    <form method="dialog">
      <h2 id="confirmModalTitle"></h2>
      <p id="confirmModalMessage"></p>
      <menu>
        <button type="button" id="confirmModalCancelBtn">Cancel</button>
        <button type="button" id="confirmModalConfirmBtn" class="danger">Delete</button>
      </menu>
    </form>
  </dialog>
  <script src="/shared-api.js"></script>
  <script src="/shared.js"></script>
  <script>
    const api = SovereignApi.request;
    let current = null;
    let currentInteractionAllowed = false;
    let payloadState = {};
    const nodeStatus = (payload, uuid) => payload.transition_by_node[uuid]?.type;

    // Editing happens in place. An element becomes contenteditable on click,
    // commits on blur or Enter, and reverts on Escape, so there is no modal
    // between a reader and the text they are reading.
    const editable = (element, original, commit) => {
      element.classList.add('editable');
      element.tabIndex = 0;
      const begin = () => {
        if (element.isContentEditable) return;
        element.contentEditable = 'true';
        element.focus();
        const range = document.createRange();
        range.selectNodeContents(element);
        const selection = getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      };
      element.onclick = begin;
      element.onkeydown = (event) => {
        // Not editing yet: Enter or Space begins editing.
        if (!element.isContentEditable) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            begin();
          }
          return;
        }
        // Editing: plain Enter commits; Shift+Enter inserts a line break
        // (the browser's default for a contenteditable), so clauses can hold
        // more than one line. Escape reverts.
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          element.blur();
        } else if (event.key === 'Escape') {
          element.textContent = original;
          element.contentEditable = 'false';
          element.blur();
        }
      };
      element.onblur = async () => {
        element.contentEditable = 'false';
        // innerText, not textContent: it turns the line breaks a contenteditable
        // inserts (as <br>/<div>) back into "\n", which textContent drops.
        const value = element.innerText.replace(/\n+$/, '').trim();
        if (!value || value === original) { element.textContent = original; return; }
        try {
          await commit(value);
          await load();
        } catch (error) {
          element.textContent = original;
          showToast(error.message, true);
        }
      };
      return element;
    };

    // A one-line composer replaces prompt(): it stays in the document flow,
    // so adding a clause reads as writing one.
    const composer = (label, submit) => {
      const row = document.createElement('div');
      row.className = 'composer';
      const input = document.createElement('input');
      input.placeholder = label;
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'Add';
      const send = async () => {
        const value = input.value.trim();
        if (!value) return;
        input.value = '';
        try { await submit(value); await load(); }
        catch (error) { showToast(error.message, true); }
      };
      input.onkeydown = (event) => { if (event.key === 'Enter') send(); };
      button.onclick = send;
      row.append(input, button);
      return row;
    };

    // One row shape for every level of the document:
    //   left   [status] name/text
    //   right  [add subelement]  and, on hover, [react] [delete]
    // React is deliberately not hover-only. Delete is destructive and rare,
    // so hiding it is right; reacting is the only way out of a divergence,
    // and an exit you cannot see is not an exit. It appears whenever there
    // is something to react to and stays hidden otherwise.
    const elementRow = ({node, tag, field, rename, addLabel, onAdd, onDelete,
                         deleteTitle, deleteMessage, index, count, onMove,
                         toggle, proposed = false, interactive = true}) => {
      const row = document.createElement('div');
      row.className = 'element-row';
      row.classList.toggle('is-proposed', proposed);
      const transition = payloadState.transition_by_node?.[node.uuid];
      const status = transition?.type && transition.type !== 'in_agreement'
        ? transition.type : 'in_agreement';
      row.dataset.status = status;

      const lamp = document.createElement('span');
      lamp.className = 'status-lamp';
      lamp.dataset.status = status;
      lamp.title = transition ? transitionLabel(transition) : 'In agreement';
      lamp.setAttribute('aria-label', lamp.title);

      const label = document.createElement(tag);
      label.className = 'element-label';
      label.textContent = node.data[field];
      if (rename && !proposed && interactive) {
        editable(label, node.data[field], rename);
      }

      const actions = document.createElement('span');
      actions.className = 'element-actions';
      if (proposed) {
        const badge = document.createElement('span');
        badge.className = 'proposal-badge';
        badge.textContent = 'Proposed';
        actions.append(badge);
      }

      // Reorder among siblings. Up/down rather than drag: unambiguous, works
      // by keyboard, and does not fight the click-to-edit on the text itself.
      if (interactive && onMove) {
        const up = document.createElement('button');
        up.type = 'button';
        up.className = 'element-move';
        up.textContent = '↑';
        up.title = 'Move up';
        up.disabled = index === 0;
        up.onclick = () => onMove(index - 1);
        const down = document.createElement('button');
        down.type = 'button';
        down.className = 'element-move';
        down.textContent = '↓';
        down.title = 'Move down';
        down.disabled = index === count - 1;
        down.onclick = () => onMove(index + 1);
        actions.append(up, down);
      }

      if (interactive && onAdd) {
        const add = document.createElement('button');
        add.type = 'button';
        add.className = 'element-add';
        add.textContent = addLabel;
        add.title = addLabel;
        add.onclick = onAdd;
        actions.append(add);
      }

      if (interactive
          && transition
          && !['in_agreement', 'in_transition'].includes(transition.type)
          && transition.peer_addr) {
        const react = document.createElement('button');
        react.type = 'button';
        react.className = 'element-react';
        const sourceType = transition.original_type || transition.type;
        const rollback = transition.reaction === 'rollback';
        const peerMissing = sourceType === 'peer_missing_node';
        const withdraw = rollback && peerMissing;
        const acceptRemoval = !rollback && peerMissing;
        react.textContent = withdraw
          ? 'Withdraw proposal'
          : (acceptRemoval
            ? 'Accept removal'
          : (rollback
            ? 'Revert mine'
            : (sourceType === 'local_missing_node'
              ? 'Accept proposal' : 'Take theirs')));
        react.title = transitionLabel(transition);
        react.onclick = async () => {
          try {
            await api('/api/agreement/react', {
              node_uuid: node.uuid,
              source_addr: transition.peer_addr,
              reaction: transition.reaction || 'adopt',
              absent: peerMissing,
            });
            await load();
            showToast(withdraw
              ? 'Proposal withdrawn'
              : (rollback
                ? 'Reverted your change'
                : (acceptRemoval ? 'Removal accepted' : 'Accepted their version')));
          } catch (error) { showToast(error.message, true); }
        };
        actions.append(react);
      }

      if (interactive && onDelete) {
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'element-delete';
        remove.textContent = 'Delete';
        remove.title = 'Delete';
        remove.onclick = () => {
          document.querySelector('#confirmModalConfirmBtn').textContent = 'Delete';
          confirmAction(deleteTitle, deleteMessage, onDelete);
        };
        actions.append(remove);
      }

      // A caret right after the name, and nothing else: what it hides is
      // directly below it, so a word saying so would only repeat the page.
      // It shares the label's grid cell rather than taking one of its own,
      // which would put every other row's actions in a different column.
      let heading = label;
      if (toggle) {
        heading = document.createElement('span');
        heading.className = 'element-heading';
        const caret = document.createElement('button');
        caret.type = 'button';
        caret.className = 'element-toggle';
        const draw = open => {
          caret.textContent = open ? '▾' : '▸';
          caret.title = open ? 'Hide the text' : 'Show the text';
          caret.setAttribute('aria-expanded', String(open));
        };
        draw(toggle.expanded);
        caret.onclick = () => {
          const open = caret.getAttribute('aria-expanded') !== 'true';
          draw(open);
          toggle.onToggle(open);
        };
        heading.append(label, caret);
      }

      row.append(lamp, heading, actions);
      return row;
    };

    // Live children in display order. Mirrors Session._ordered_children: an
    // explicit "order" wins, otherwise the node keeps its position in the
    // payload (which is creation order), so items pre-dating ordering still
    // sort sensibly.
    const ordered = (children) => (children || [])
      .filter(node => !node.deleted)
      .map((node, position) => [node, node.data.order ?? position])
      .sort((a, b) => a[1] - b[1])
      .map(pair => pair[0]);

    const proposedChildren = (parentUuid) => (payloadState.proposed_nodes || [])
      .map(entry => entry.node)
      .filter(node => !node.deleted && node.parent_uuid === parentUuid);

    const displayedChildren = (parent, nodeType, inheritedProposal = false) => {
      const entries = ordered(parent.children)
        .filter(node => node.data.type === nodeType)
        .map(node => ({node, proposed: inheritedProposal}));
      if (!inheritedProposal) {
        const present = new Set(entries.map(entry => entry.node.uuid));
        for (const node of proposedChildren(parent.uuid)) {
          if (node.data.type === nodeType && !present.has(node.uuid)) {
            entries.push({node, proposed: true});
          }
        }
      }
      return entries
        .map((entry, position) => [
          entry, entry.node.data.order ?? position,
        ])
        .sort((a, b) => a[1] - b[1])
        .map(pair => pair[0]);
    };

    const selectAgreement = async (agreementUuid) => {
      await api('/api/agreement/agreements/select',
        {agreement_uuid: agreementUuid});
      await load();
    };

    const renderOrganization = (organization) => {
      const tree = document.querySelector('#organizationTree');
      tree.replaceChildren();
      const renderNode = (item, depth = 0) => {
        const branch = document.createElement('div');
        branch.className = 'organization-branch';
        branch.style.setProperty('--depth', depth);
        const row = document.createElement('div');
        row.className = 'organization-row';
        row.classList.toggle('is-current', item.uuid === current?.uuid);
        row.classList.toggle('is-restricted', !item.joined);
        row.classList.toggle(
          'is-readonly', item.joined && !item.interaction_allowed,
        );

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'organization-name';
        button.textContent = item.title;
        button.disabled = !item.joined;
        button.title = item.joined
          ? (
            item.interaction_allowed
              ? `Open ${item.title}`
              : `Open ${item.title} read-only`
          )
          : 'This subagreement has separate membership';
        if (item.joined) button.onclick = () => selectAgreement(item.uuid);

        const count = document.createElement('span');
        count.className = 'member-count';
        count.textContent = item.joined
          ? `${(item.members || []).length} ${(item.members || []).length === 1 ? 'person' : 'people'}`
          : 'Not joined';
        row.append(button, count);
        // An agreement nobody is in reads as a tree row like any other, and
        // would otherwise be indistinguishable from one people rely on. Only
        // that case is marked here: one actor is the ordinary state of
        // anything you have just made, so badging it in a tree of your own
        // agreements marks every row and distinguishes nothing. It stays on
        // the agreement's own page, where it is about that agreement.
        if (item.state === 'template') {
          const state = document.createElement('span');
          state.className = 'state-badge';
          state.dataset.state = item.state;
          state.textContent = TEMPLATE_BADGE.label;
          state.title = TEMPLATE_BADGE.title;
          row.append(state);
        }
        // The tree is drawn through home, so any other seat this agreement
        // holds would otherwise be invisible - and an unseen second parent
        // is a trap for whoever deletes the first.
        if ((item.other_parents || []).length) {
          const also = document.createElement('span');
          also.className = 'other-parents';
          also.textContent = 'also in: '
            + item.other_parents.map(other => other.title).join(', ');
          row.append(also);
        }
        if (item.relationship_status === 'awaiting_parent_agreement') {
          const pending = document.createElement('span');
          pending.className = 'relationship-pending';
          pending.textContent = 'Parent link pending';
          row.append(pending);
        }
        branch.append(row);
        for (const child of item.children || []) {
          branch.append(renderNode(child, depth + 1));
        }
        return branch;
      };
      for (const root of organization?.roots || []) {
        tree.append(renderNode(root));
      }
      if (!tree.children.length) {
        const empty = document.createElement('p');
        empty.className = 'organization-empty';
        empty.textContent = 'No agreements yet';
        tree.append(empty);
      }
    };

    // Who is here, and what they hold. My own line comes first and is the
    // only one that acts: a badge is taken or stepped out of by clicking it.
    // Everybody else's badges are a statement of where they stand, not a
    // control over them.
    const ACTOR_MARK = {individual: '\u{1F464}', agreement: '\u{1F465}'};

    // A picture where there is one, an initial for a person without, the
    // group mark for an agreement. Shared, so an actor looks the same
    // wherever it is drawn.
    const avatarFor = (person) => {
      if (person.picture) {
        const image = document.createElement('img');
        image.className = 'acceptance-avatar';
        image.src = person.picture;
        image.alt = '';
        return image;
      }
      const mark = document.createElement('span');
      mark.className = 'acceptance-avatar acceptance-initials';
      mark.dataset.kind = person.actor_kind || 'individual';
      mark.textContent = person.actor_kind === 'agreement'
        ? ACTOR_MARK.agreement
        : (person.name || '?').trim().slice(0, 1).toUpperCase();
      return mark;
    };

    const renderParticipants = (participants, identity, interactive) => {
      const section = document.createElement('section');
      section.className = 'acceptance-panel';
      const heading = document.createElement('div');
      heading.className = 'acceptance-heading';
      const title = document.createElement('h3');
      title.textContent = 'Actors';
      const reference = document.createElement('p');
      reference.textContent =
        'Each role is accepted against a version of this agreement.';
      heading.append(title, reference);
      section.append(heading);

      // Identity is a role like any other here, drawn with a key so it can
      // be told apart at a glance.
      const badgesFor = (person) => {
        const badges = [];
        if (identity?.state === 'held'
            && identity.holder_actor_uuid === person.uuid) {
          badges.push({name: 'Identity', status: 'accepted', identity: true});
        }
        return badges.concat(person.roles || []);
      };

      const badgeElement = (role, actionable) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'role-chip';
        chip.dataset.status = role.status;
        if (role.identity) chip.dataset.identity = 'true';
        chip.textContent = role.identity ? `\u{1F511} ${role.name}` : role.name;
        const label = HOLDER_STATUS[role.status] || role.status;
        if (!actionable || role.identity) {
          chip.disabled = true;
          chip.title = `${role.name} \u2014 ${label}`;
          return chip;
        }
        const held = role.status === 'accepted';
        chip.title = held
          ? `${role.name} \u2014 ${label}. Click to step out.`
          : `${role.name} \u2014 ${label}. Click to take it.`;
        chip.onclick = async () => {
          chip.disabled = true;
          try {
            await api(
              held ? '/api/agreement/roles/resign'
                   : '/api/agreement/roles/decide',
              held ? {role_uuid: role.uuid}
                   : {role_uuid: role.uuid, decision: 'accepted'},
            );
            await load();
          } catch (error) {
            chip.disabled = false;
            showToast(error.message, true);
          }
        };
        return chip;
      };

      const rowFor = (person, actionable) => {
        const row = document.createElement('div');
        row.className = 'participant';
        row.classList.toggle('is-self', Boolean(person.is_self));
        row.append(avatarFor(person));
        const body = document.createElement('span');
        body.className = 'acceptance-body';
        const name = document.createElement('strong');
        name.textContent = person.is_self ? 'You' : person.name;
        body.append(name);
        const chips = document.createElement('span');
        chips.className = 'participant-roles';
        const badges = badgesFor(person);
        for (const role of badges) chips.append(badgeElement(role, actionable));
        if (!badges.length) {
          const none = document.createElement('span');
          none.className = 'participant-observer';
          none.textContent = 'holds no role here';
          chips.append(none);
        }
        body.append(chips);
        row.append(body);
        return row;
      };

      // This agreement is an actor too, and the roles it holds elsewhere are
      // roles like any other - so they are badges on its own line, read and
      // acted on exactly as yours are. There is no separate idea of a seat:
      // "Operations in Cooperative" is one role, named by where it is.
      const ownRow = () => {
        const seats = payloadState.parents || [];
        const offers = payloadState.seat_offers || [];
        if (!seats.length && !offers.length) return null;
        const row = document.createElement('div');
        row.className = 'participant is-agreement';
        row.append(avatarFor({actor_kind: 'agreement'}));
        const body = document.createElement('span');
        body.className = 'acceptance-body';
        const name = document.createElement('strong');
        name.textContent = 'This agreement';
        const chips = document.createElement('span');
        chips.className = 'participant-roles';
        // Whoever speaks for the agreement answers for it, so the badges act
        // only for them. For everybody else they state where it stands.
        const mine = interactive && payloadState.holds_identity;
        for (const [index, seat] of seats.entries()) {
          chips.append(seatChip(seat, index, seats.length, mine));
        }
        for (const offer of offers) chips.append(offerChip(offer, mine));
        body.append(name, chips);
        row.append(body);
        return row;
      };

      // Held. Clicking steps out of it, the way your own accepted badge does.
      const seatChip = (seat, index, total, mine) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'role-chip';
        chip.dataset.status = seat.live ? 'accepted' : 'outdated';
        chip.textContent = `${seat.role_name || 'Role'} in ${seat.title}`;
        // Home is where the organisation draws it, and home is the first
        // seat in order that works - so the order is the only control there
        // is, and it lives on the badges themselves.
        const place = seat.is_home
          ? 'drawn here'
          : (seat.live ? 'also held here' : 'not reachable from here');
        if (!mine) {
          chip.disabled = true;
          chip.title = `${chip.textContent} — ${place}`;
          return chip;
        }
        chip.title = `${chip.textContent} — ${place}. Click to step out.`;
        chip.onclick = async () => {
          chip.disabled = true;
          try {
            await api('/api/agreement/roles/unseat', {
              role_uuid: seat.role_uuid, agreement_uuid: current.uuid,
            });
            await load();
          } catch (error) {
            chip.disabled = false;
            showToast(error.message, true);
          }
        };
        if (index > 0 && total > 1) {
          const prefer = document.createElement('span');
          prefer.className = 'chip-action';
          prefer.textContent = '↑';
          prefer.title = `Draw this agreement under ${seat.title}`;
          prefer.onclick = async event => {
            event.stopPropagation();
            try {
              await api('/api/agreement/parents/move',
                {holding_uuid: seat.holding_uuid, index: 0});
              await load();
            } catch (error) { showToast(error.message, true); }
          };
          chip.append(prefer);
        }
        return chip;
      };

      // Offered. Clicking takes it, the way your own pending badge does.
      const offerChip = (offer, mine) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'role-chip';
        chip.dataset.status = offer.answer === 'refused' ? 'refused' : 'pending';
        chip.textContent = `${offer.role_name} in ${offer.title}`;
        const label = offer.answer === 'refused'
          ? 'turned down' : 'offered, not yet taken';
        if (offer.circular) {
          chip.disabled = true;
          chip.dataset.status = 'expired';
          chip.title = `${chip.textContent} — ${offer.title} already sits`
            + ' below this agreement, so taking it would make the'
            + ' organisation circular.';
          return chip;
        }
        if (!mine) {
          chip.disabled = true;
          chip.title = `${chip.textContent} — ${label}`;
          return chip;
        }
        chip.title = `${chip.textContent} — ${label}. Click to take it.`;
        chip.onclick = async () => {
          chip.disabled = true;
          try {
            await api('/api/agreement/roles/seat', {
              role_uuid: offer.role_uuid, agreement_uuid: current.uuid,
            });
            await load();
            showToast(`Now holding ${offer.role_name} in ${offer.title}`);
          } catch (error) {
            chip.disabled = false;
            showToast(error.message, true);
          }
        };
        // Turning an invitation down is the only thing here that is not
        // simply taking or leaving a role, so it is the one extra mark.
        if (offer.answer !== 'refused') {
          const decline = document.createElement('span');
          decline.className = 'chip-action';
          decline.textContent = '×';
          decline.title = `Decline ${offer.role_name} in ${offer.title}`;
          decline.onclick = async event => {
            event.stopPropagation();
            try {
              await api('/api/agreement/roles/decline_seat', {
                role_uuid: offer.role_uuid, agreement_uuid: current.uuid,
              });
              await load();
            } catch (error) { showToast(error.message, true); }
          };
          chip.append(decline);
        }
        return chip;
      };

      const people = participants || [];
      const me = people.find(person => person.is_self);
      const others = people.filter(person => !person.is_self);
      if (me) section.append(rowFor(me, interactive));
      const own = ownRow();
      if (own) section.append(own);
      if (others.length) {
        const rest = document.createElement('div');
        rest.className = 'acceptance-badges';
        for (const person of others) rest.append(rowFor(person, false));
        section.append(rest);
      }
      return section;
    };
    const findDisplayedNode = (uuid) => {
      const roots = [
        current,
        ...(payloadState.proposed_nodes || []).map(entry => entry.node),
      ].filter(Boolean);
      const pending = [...roots];
      const seen = new Set();
      while (pending.length) {
        const node = pending.pop();
        if (!node || seen.has(node.uuid)) continue;
        if (node.uuid === uuid) return node;
        seen.add(node.uuid);
        pending.push(...(node.children || []));
      }
      return null;
    };

    // UI state that holds no focus, so the edit guard in render() cannot
    // protect it and a rebuild would close it. Kept here rather than in the
    // DOM so a full re-render restores it instead of destroying it.
    const ephemeral = {openMenu: ''};

    // Identity is one line, not a panel: it says who speaks for this
    // agreement and gets out of the way. Taking it from somebody is real but
    // rare, so it lives behind the overflow rather than as a button.
    const renderIdentity = (identity, interactive) => {
      const line = document.createElement('div');
      line.className = 'identity-line';
      const claims = identity.claims || [];
      const state = claims.length ? 'contested' : (identity.state || 'vacant');
      line.dataset.state = state;

      const mark = document.createElement('span');
      mark.className = 'identity-mark';
      mark.textContent = state === 'held' ? '\u{1F511}' : '⚠';

      const text = document.createElement('span');
      text.className = 'identity-text';
      if (state === 'ambiguous') {
        text.textContent =
          'Identity is recorded twice here. Settle that before changing it.';
      } else if (state === 'vacant') {
        text.textContent = 'Identity: nobody yet';
      } else if (!claims.length) {
        text.textContent = `Identity: ${identity.holder_name}`;
      } else {
        // One competing record, two meanings - say which one this is. The
        // holder reads as "you" when it is you, or the sentence turns into
        // "you see You".
        const handover = claims.every(claim => claim.is_handover);
        const others = claims.map(claim => claim.holder_name).join(', ');
        const here = identity.is_self
          ? 'you still hold it' : `you see ${identity.holder_name}`;
        text.textContent = handover
          ? `Identity handover: ${others} has taken it, ${here}`
          : `Identity contested: ${here}, elsewhere ${others}`;
      }

      const actions = document.createElement('span');
      actions.className = 'identity-actions';

      const transition = identity.node_uuid
        ? payloadState.transition_by_node?.[identity.node_uuid]
        : null;
      if (interactive && claims.length && transition?.peer_addr) {
        const theirs = document.createElement('button');
        theirs.type = 'button';
        theirs.textContent = `Accept ${claims[0].holder_name}`;
        theirs.onclick = async () => {
          try {
            await api('/api/agreement/react', {
              node_uuid: identity.node_uuid,
              source_addr: transition.peer_addr,
              reaction: 'adopt',
            });
            await load();
            showToast('Identity updated');
          } catch (error) { showToast(error.message, true); }
        };
        const mine = document.createElement('button');
        mine.type = 'button';
        mine.textContent =
          `Keep ${identity.is_self ? 'yours' : identity.holder_name}`;
        mine.onclick = async () => {
          try {
            await api('/api/agreement/react', {
              node_uuid: identity.node_uuid,
              source_addr: transition.peer_addr,
              reaction: 'rollback',
            });
            await load();
            showToast('Kept your version');
          } catch (error) { showToast(error.message, true); }
        };
        actions.append(theirs, mine);
      }

      if (interactive && state !== 'ambiguous' && !identity.is_self) {
        const menuKey = `identity:${current?.uuid || ''}`;
        const menu = document.createElement('span');
        menu.className = 'identity-menu';
        menu.classList.toggle('is-open', ephemeral.openMenu === menuKey);
        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'identity-toggle';
        toggle.textContent = '⋯';
        toggle.title = 'Identity options';
        toggle.onclick = () => {
          const open = ephemeral.openMenu === menuKey;
          ephemeral.openMenu = open ? '' : menuKey;
          menu.classList.toggle('is-open', !open);
        };
        const take = document.createElement('button');
        take.type = 'button';
        take.className = 'identity-take';
        take.textContent = 'Take Identity';
        take.onclick = () => {
          const run = async () => {
            try {
              await api('/api/agreement/identity/take',
                {agreement_uuid: current.uuid});
              ephemeral.openMenu = '';
              await load();
              showToast('You now hold Identity');
            } catch (error) { showToast(error.message, true); }
          };
          if (state === 'vacant') { run(); return; }
          document.querySelector('#confirmModalConfirmBtn').textContent =
            'Take Identity';
          confirmAction(
            'Take Identity from ' + identity.holder_name + '?',
            identity.holder_name + ' currently holds Identity. Taking it '
            + 'writes a competing holder into the same record, which both of '
            + 'you will see as a divergence until one of you settles it.',
            run,
          );
        };
        menu.append(toggle, take);
        actions.append(menu);
      }

      line.append(mark, text, actions);
      return line;
    };

    // "Unobserved" is deliberately not worded as "pending": one means they
    // have not answered, the other that this session cannot see whether they
    // have. Collapsing them would be a lie the interface tells.
    const HOLDER_STATUS = {
      accepted: 'accepted',
      pending: 'offered, not yet decided',
      requested: 'asked to take this',
      revoked: 'offer withdrawn',
      refused: 'refused',
      expired: 'lapsed',
      outdated: 'accepted an earlier version',
      uninvited: 'not invited to this agreement yet',
      unobserved: 'answer not visible from here',
    };

    // An agreement nobody is in is worth marking in the tree, where it sits
    // among agreements people rely on. On its own page it needs no line: the
    // Identity line already says nobody holds it and every role already says
    // nobody is invited, so a third statement of the same fact is repetition.
    // Working and instantiated are marked nowhere - they are the ordinary
    // states of anything you have made.
    const TEMPLATE_BADGE = {
      label: 'Template',
      title: 'Nobody holds a role here.',
    };

    // Accountabilities and domains differ only in what they are called, so
    // one card renders both columns from this table.
    const ROLE_ITEM_KINDS = [
      {
        kind: 'accountability', type: 'agreement_accountability',
        label: 'Accountabilities', add: 'New accountability',
      },
      {
        kind: 'domain', type: 'agreement_domain',
        label: 'Domains', add: 'New domain',
      },
    ];

    const renderRoleCard = ({role, proposed, index, count, interactive,
                             movable}) => {
      const card = document.createElement('article');
      card.className = 'role-card';
      card.classList.toggle('is-proposed', proposed);

      card.append(elementRow({
        node: role,
        tag: 'h4',
        field: 'name',
        rename: value => api('/api/agreement/roles/rename',
          {role_uuid: role.uuid, name: value}),
        proposed,
        interactive,
        index,
        count,
        onMove: movable ? async newIndex => {
          try {
            await api('/api/agreement/roles/move',
              {role_uuid: role.uuid, index: newIndex});
            await load();
          } catch (error) { showToast(error.message, true); }
        } : null,
        onDelete: interactive ? async () => {
          try {
            await api('/api/agreement/roles/delete', {role_uuid: role.uuid});
            await load();
          } catch (error) { showToast(error.message, true); }
        } : null,
        deleteTitle: 'Delete this role?',
        deleteMessage:
          'Its accountabilities and domains go with it. This cannot be undone.',
      }));

      // An unset purpose is a genuinely empty element - the prompt is a CSS
      // pseudo-element, so it can never be committed as the value.
      const purpose = document.createElement('p');
      purpose.className = 'role-purpose';
      purpose.textContent = role.data.purpose || '';
      if (interactive) {
        editable(purpose, role.data.purpose || '', value =>
          api('/api/agreement/roles/set_purpose',
            {role_uuid: role.uuid, purpose: value}));
      }
      card.append(purpose);

      const columns = document.createElement('div');
      columns.className = 'role-columns';
      for (const {kind, type, label, add} of ROLE_ITEM_KINDS) {
        const column = document.createElement('div');
        column.className = 'role-column';
        const columnTitle = document.createElement('h5');
        columnTitle.textContent = label;
        column.append(columnTitle);
        const items = displayedChildren(role, type, proposed);
        const itemsHaveProposals = items.some(entry => entry.proposed);
        items.forEach(({node: item, proposed: itemProposed}, itemIndex) => {
          column.append(elementRow({
            node: item,
            tag: 'p',
            field: 'text',
            rename: value => api('/api/agreement/roles/items/update',
              {item_uuid: item.uuid, text: value}),
            proposed: itemProposed,
            interactive: interactive && !itemProposed,
            index: itemIndex,
            count: items.length,
            onMove: (!interactive || itemProposed || itemsHaveProposals)
              ? null
              : async newIndex => {
                try {
                  await api('/api/agreement/roles/items/move',
                    {item_uuid: item.uuid, index: newIndex});
                  await load();
                } catch (error) { showToast(error.message, true); }
              },
            onDelete: interactive && !itemProposed ? async () => {
              try {
                await api('/api/agreement/roles/items/delete',
                  {item_uuid: item.uuid});
                await load();
              } catch (error) { showToast(error.message, true); }
            } : null,
            deleteTitle: `Delete this ${kind}?`,
            deleteMessage: 'This cannot be undone.',
          }));
        });
        if (interactive) {
          column.append(composer(add, async text => {
            await api('/api/agreement/roles/items/create',
              {role_uuid: role.uuid, kind, text});
          }));
        }
        columns.append(column);
      }
      card.append(columns);

      // Who has been invited, and where each of them stands. Taking a role
      // or stepping out of one happens on your own line in Participants -
      // this is the definition, not the doing. The only actions here are the
      // Identity holder's, because inviting and withdrawing are theirs
      // alone and there is nowhere else for them to live.
      const holders = (payloadState.role_holders || {})[role.uuid] || [];
      const held = document.createElement('div');
      held.className = 'role-holders';
      const heldTitle = document.createElement('h5');
      heldTitle.textContent = 'Held by';
      held.append(heldTitle);
      if (!holders.length) {
        const none = document.createElement('p');
        none.className = 'role-unheld';
        none.textContent = 'Nobody invited yet';
        held.append(none);
      }
      // A line of faces and names, and nothing else on the page. Who holds a
      // role is a glance; when they answered, against which version, and who
      // offered it are questions you only ask about one of them, so they
      // live in the tooltip rather than in six columns of small type.
      const badges = document.createElement('div');
      badges.className = 'holder-badges';
      for (const holder of holders) {
        const badge = document.createElement('span');
        badge.className = 'holder-badge';
        badge.dataset.status = holder.status;
        badge.dataset.actorKind = holder.actor_kind;
        const name = document.createElement('span');
        name.className = 'holder-name';
        name.textContent = holder.is_self ? 'You' : holder.name;
        badge.append(avatarFor(holder), name);

        const detail = [HOLDER_STATUS[holder.status] || holder.status];
        if (holder.status === 'unobserved') {
          detail.push(
            'You do not sync with them, so you cannot see their answer.',
          );
        }
        if (holder.actor_kind === 'agreement' && !holder.joined) {
          detail.push(
            'Invited separately; you have not joined that agreement.',
          );
        }
        if (holder.offered_at) {
          detail.push(
            `Offered ${new Date(holder.offered_at).toLocaleString()}`,
          );
        }
        if (holder.decided_at) {
          detail.push(
            `Answered ${new Date(holder.decided_at).toLocaleString()}`,
          );
        }
        if (holder.expires_at) {
          detail.push(
            `Until ${new Date(holder.expires_at).toLocaleString()}`,
          );
        }
        badge.title = `${holder.is_self ? 'You' : holder.name} — `
          + detail.map(part => part.replace(/\.$/, '')).join('. ');

        // A seat filled by another agreement opens it. Structure is made by
        // filling a role, so this is where the organisation is walked.
        if (holder.actor_kind === 'agreement' && holder.joined) {
          badge.classList.add('agreement-link');
          badge.tabIndex = 0;
          const open = () => selectAgreement(holder.actor_uuid);
          badge.onclick = open;
          badge.onkeydown = event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              open();
            }
          };
          badge.title += `. Click to open ${holder.name}`;
        }

        // Inviting and withdrawing are the Identity holder's alone, and
        // there is nowhere else for them to live. One small mark on the
        // badge, revealed on hover the way Delete is, so the line stays a
        // line of people rather than a row of controls.
        const mine = interactive && payloadState.holds_identity;
        if (mine && holder.status === 'requested' && !holder.is_self) {
          const confirm = document.createElement('button');
          confirm.type = 'button';
          confirm.className = 'holder-action';
          confirm.textContent = '✓';
          confirm.title = `Confirm ${holder.name} in ${role.data.name}`;
          confirm.onclick = async event => {
            event.stopPropagation();
            try {
              await api('/api/agreement/roles/offer',
                {role_uuid: role.uuid, actor_uuid: holder.actor_uuid});
              await load();
              showToast(`${holder.name} now holds ${role.data.name}`);
            } catch (error) { showToast(error.message, true); }
          };
          badge.append(confirm);
        } else if (mine && holder.status !== 'revoked') {
          const revoke = document.createElement('button');
          revoke.type = 'button';
          revoke.className = 'holder-action';
          revoke.textContent = '×';
          revoke.title = `Withdraw ${holder.name}'s offer of ${role.data.name}`;
          revoke.onclick = event => {
            event.stopPropagation();
            document.querySelector('#confirmModalConfirmBtn').textContent =
              'Revoke';
            confirmAction(
              `Revoke ${holder.name}'s offer of ${role.data.name}?`,
              'This withdraws the offer. Their own record of the answer they '
              + 'gave is theirs and stays, but the role is no longer held.',
              async () => {
                try {
                  await api('/api/agreement/roles/revoke',
                    {role_uuid: role.uuid, actor_uuid: holder.actor_uuid});
                  await load();
                } catch (error) { showToast(error.message, true); }
              },
            );
          };
          badge.append(revoke);
        }
        badges.append(badge);
      }
      if (holders.length) held.append(badges);

      // Inviting is the Identity holder's alone.
      if (interactive && payloadState.holds_identity) {
        // A withdrawn offer is re-offerable - offer_role revives the same
        // record - so only a standing one takes somebody out of the list. A
        // request is left out too, because Confirm on their row is how that
        // one is answered.
        const spoken = new Set(
          holders
            .filter(holder => holder.status !== 'revoked')
            .map(holder => holder.actor_uuid),
        );
        const candidates = (payloadState.offerable_actors || [])
          .filter(actor => !spoken.has(actor.uuid));
        if (candidates.length) {
          const picker = document.createElement('select');
          picker.className = 'role-offer-picker';
          const blank = document.createElement('option');
          blank.value = '';
          blank.textContent = 'Offer to\u2026';
          picker.append(blank);
          const groups = {
            individual: document.createElement('optgroup'),
            agreement: document.createElement('optgroup'),
          };
          groups.individual.label = 'People';
          groups.agreement.label = 'Agreements';
          for (const actor of candidates) {
            const option = document.createElement('option');
            option.value = actor.uuid;
            // A profile with no display name falls back to an address, which
            // is a poor way to be told about yourself.
            option.textContent = actor.uuid === payloadState.identity_uuid
              ? 'You'
              : actor.name;
            groups[actor.kind === 'agreement' ? 'agreement' : 'individual']
              .append(option);
          }
          for (const group of Object.values(groups)) {
            if (group.childElementCount) picker.append(group);
          }
          picker.onchange = async () => {
            if (!picker.value) return;
            const chosen = picker.value;
            picker.value = '';
            try {
              await api('/api/agreement/roles/offer',
                {role_uuid: role.uuid, actor_uuid: chosen});
              await load();
            } catch (error) { showToast(error.message, true); }
          };
          held.append(picker);
        }
      }
      card.append(held);
      return card;
    };

    // Roles are content, not administration. They render inside the document
    // rather than in a side panel, because a role is part of what people
    // accept - but as cards rather than prose, because they are structured.
    const renderRoles = (agreement, interactive) => {
      const section = document.createElement('section');
      section.className = 'roles';
      const sectionHeading = document.createElement('div');
      sectionHeading.className = 'roles-heading';
      const title = document.createElement('h3');
      title.textContent = 'Role Definitions & Invitations';
      const explanation = document.createElement('p');
      explanation.textContent =
        'What this agreement expects, and who has been invited to it.';
      sectionHeading.append(title, explanation);
      section.append(sectionHeading);

      const roles = displayedChildren(agreement, 'agreement_role');
      const rolesHaveProposals = roles.some(entry => entry.proposed);
      roles.forEach(({node: role, proposed}, index) => {
        section.append(renderRoleCard({
          role,
          proposed,
          index,
          count: roles.length,
          interactive: interactive && !proposed,
          movable: interactive && !proposed && !rolesHaveProposals,
        }));
      });
      if (!roles.length) {
        const empty = document.createElement('p');
        empty.className = 'roles-empty';
        empty.textContent = 'No roles yet.';
        section.append(empty);
      }
      if (interactive) {
        section.append(composer('New role name', async name => {
          await api('/api/agreement/roles/create',
            {agreement_uuid: agreement.uuid, name});
        }));
      }
      return section;
    };

    // The document is rebuilt wholesale on every poll. That stays - it is
    // cheap at this size and needs no second render path - but an unchanged
    // payload should cost nothing. Recorded only once the document is
    // actually rebuilt, so a render skipped by the edit guard below is
    // retried on the next poll instead of being lost.
    let renderedPayloadJson = '';

    const render = (payload) => {
      const encoded = JSON.stringify(payload);
      if (encoded === renderedPayloadJson) { SovereignShell.refresh(); return; }
      payloadState = payload;
      current = payload.agreement;
      currentInteractionAllowed = Boolean(payload.interaction?.allowed);
      renderOrganization(payload.organization);
      SovereignShell.setTopicSelector({
        label: 'Agreement',
        topics: payload.agreements.map(item => ({
          uuid: item.uuid,
          title: item.data.title || 'Untitled agreement',
        })),
        selectedUuid: current?.uuid || '',
        onSelect: selectAgreement,
        onRename: current && currentInteractionAllowed ? async title => {
          await api('/api/agreement/agreements/rename',
            {agreement_uuid: current.uuid, title});
          await load();
        } : null,
      });
      document.querySelector('#empty').hidden = Boolean(current);

      const article = document.querySelector('#document');
      // Never rebuild the document while it is being edited, or the caret
      // is destroyed mid-word by the poll.
      if (article.contains(document.activeElement)
        && (
          document.activeElement.isContentEditable
          || document.activeElement.matches('input, textarea, select')
        )) {
        SovereignShell.refresh();
        return;
      }
      renderedPayloadJson = encoded;
      article.replaceChildren();
      article.classList.toggle('is-readonly', !currentInteractionAllowed);
      if (!current) { SovereignShell.refresh(); return; }

      // The text collapses behind a caret on the title itself. Built before
      // the title row so the caret has something to fold, and filled after.
      const content = document.createElement('section');
      content.className = 'content';
      const contentOpen = ephemeral.contentCollapsed !== current.uuid;
      content.classList.toggle('is-collapsed', !contentOpen);

      article.append(elementRow({
        node: current,
        tag: 'h2',
        field: 'title',
        rename: value => api('/api/agreement/agreements/rename',
          {agreement_uuid: current.uuid, title: value}),
        addLabel: '+ Section',
        onAdd: async () => {
          try {
            await api('/api/agreement/sections/create',
              {agreement_uuid: current.uuid, title: 'Untitled section'});
            await load();
          } catch (error) { showToast(error.message, true); }
        },
        toggle: {
          expanded: contentOpen,
          onToggle: open => {
            ephemeral.contentCollapsed = open ? '' : current.uuid;
            content.classList.toggle('is-collapsed', !open);
          },
        },
        interactive: currentInteractionAllowed,
      }));
      if (!currentInteractionAllowed) {
        const notice = document.createElement('p');
        notice.className = 'readonly-notice';
        notice.textContent = (
          payload.interaction?.reason
          || 'This subagreement is visible but read-only.'
        );
        article.append(notice);
      }
      // Identity normally reads as a badge on whoever holds it, so the
      // line only appears when it needs attention: contested, recorded
      // twice, vacant, or held by somebody else and therefore takeable.
      const identityState = payload.identity || {state: 'vacant'};
      if (!(identityState.state === 'held'
            && identityState.is_self
            && !(identityState.claims || []).length)) {
        article.append(renderIdentity(identityState, currentInteractionAllowed));
      }
      const sections = displayedChildren(current, 'agreement_section');
      const sectionsHaveProposals = sections.some(entry => entry.proposed);
      sections.forEach(({node: section, proposed}, sIndex) => {
        const block = document.createElement('section');
        block.append(elementRow({
          node: section,
          tag: 'h3',
          field: 'title',
          proposed,
          interactive: currentInteractionAllowed,
          rename: proposed ? null : value => api(
            '/api/agreement/sections/rename',
            {section_uuid: section.uuid, title: value},
          ),
          addLabel: '+ Clause',
          onAdd: proposed ? null : async () => {
            try {
              await api('/api/agreement/clauses/create',
                {section_uuid: section.uuid, text: 'New clause'});
              await load();
            } catch (error) { showToast(error.message, true); }
          },
          onDelete: proposed ? null : async () => {
            try {
              await api('/api/agreement/sections/delete', {section_uuid: section.uuid});
              await load();
            } catch (error) { showToast(error.message, true); }
          },
          deleteTitle: 'Delete this section?',
          deleteMessage: 'Its clauses are deleted with it. This cannot be undone.',
          index: sIndex,
          count: sections.length,
          onMove: proposed || sectionsHaveProposals ? null : async newIndex => {
            try {
              await api('/api/agreement/sections/move',
                {section_uuid: section.uuid, index: newIndex});
              await load();
            } catch (error) { showToast(error.message, true); }
          },
        }));

        const clauses = displayedChildren(
          section, 'agreement_clause', proposed,
        );
        const clausesHaveProposals = clauses.some(entry => entry.proposed);
        clauses.forEach(({node: clause, proposed: clauseProposed}, cIndex) => {
          block.append(elementRow({
            node: clause,
            tag: 'p',
            field: 'text',
            proposed: clauseProposed,
            interactive: currentInteractionAllowed,
            rename: clauseProposed ? null : value => api(
              '/api/agreement/clauses/update',
              {clause_uuid: clause.uuid, text: value},
            ),
            onDelete: clauseProposed ? null : async () => {
              try {
                await api('/api/agreement/clauses/delete', {clause_uuid: clause.uuid});
                await load();
              } catch (error) { showToast(error.message, true); }
            },
            deleteTitle: 'Delete this clause?',
            deleteMessage: 'This cannot be undone.',
            index: cIndex,
            count: clauses.length,
            onMove: clauseProposed || clausesHaveProposals ? null : async newIndex => {
              try {
                await api('/api/agreement/clauses/move',
                  {clause_uuid: clause.uuid, index: newIndex});
                await load();
              } catch (error) { showToast(error.message, true); }
            },
          }));
        });
        content.append(block);
      });
      article.append(content);
      article.append(renderParticipants(
        payload.participants, payload.identity, currentInteractionAllowed,
      ));
      article.append(renderRoles(current, currentInteractionAllowed));
      SovereignShell.refresh();
    };

    const load = async () => render(await api('/api/agreement/document'));

    SovereignShell.mount({
      container: document.querySelector('#shell'),
      applicationId: 'agreement',
      topicUuid: () => (
        currentInteractionAllowed ? (current?.uuid || '') : ''
      ),
      state: () => payloadState,
      onChanged: () => load(),
      agendaRoutes: {
        topicKey: 'agreement_uuid',
        create: '/api/agreement/agenda/create',
        delete: '/api/agreement/agenda/delete',
        setPriority: '/api/agreement/agenda/set_priority',
        move: '/api/agreement/agenda/move',
      },
      // Name a node so the disagreement pane can say which clause or section
      // is unsettled, rather than showing a bare uuid.
      describeNode: (uuid) => {
        const node = findDisplayedNode(uuid);
        return node
          ? (node.data.title || node.data.text || '').slice(0, 60)
          : '';
      },
    });

    // Deep link from the overview: /apps/agreement?agreement=<uuid> selects
    // that agreement on arrival, mirroring Kanban's ?board=<uuid>.
    async function selectAgreementFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const uuid = params.get('agreement');
      if (!uuid) return;
      try {
        await api('/api/agreement/agreements/select', {agreement_uuid: uuid});
      } catch (error) { showToast(error.message, true); }
      params.delete('agreement');
      const query = params.toString();
      window.history.replaceState({}, '', window.location.pathname + (query ? `?${query}` : ''));
    }

    selectAgreementFromUrl().then(load);
    setInterval(load, 3000);
  </script>
