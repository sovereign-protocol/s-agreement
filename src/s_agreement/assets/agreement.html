<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-Agreement</title>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/apps/agreement/styles.css">
</head>
<body>
  <header>
    <h1>S-Agreement</h1>
    <span id="connection">Local</span>
  </header>
  <main>
    <div class="toolbar">
      <select id="agreements" aria-label="Agreement"></select>
      <button id="new-agreement">New agreement</button>
      <button id="new-section">Add section</button>
    </div>
    <div class="sharing" id="sharing" hidden>
      <label for="target">Relay target</label>
      <select id="target"></select>
      <button id="copy-token">Copy share token</button>
      <input id="token" placeholder="Paste a share token…" aria-label="Share token">
      <button id="connect">Connect</button>
      <span id="sharing-note"></span>
    </div>
    <p id="empty">Create or accept an agreement to begin.</p>
    <article id="document"></article>
  </main>
  <script>
    const api = async (path, body) => {
      const response = await fetch(path, body ? {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      } : {});
      const value = await response.json();
      if (!response.ok) throw new Error(value.reason || 'Request failed');
      return value;
    };
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
    let current = null;
    const nodeStatus = (payload, uuid) => payload.transition_by_node[uuid]?.type;
    const render = (payload) => {
      current = payload.agreement;
      const select = document.querySelector('#agreements');
      select.innerHTML = payload.agreements.map(item =>
        `<option value="${escapeHtml(item.uuid)}" ${item.uuid === current?.uuid ? 'selected' : ''}>${escapeHtml(item.data.title)}</option>`
      ).join('');
      document.querySelector('#connection').textContent = payload.network?.connected ? 'Connected' : 'Local';
      document.querySelector('#empty').hidden = Boolean(current);
      document.querySelector('#new-section').disabled = !current;
      document.querySelector('#document').innerHTML = current ? `
        <h2>${escapeHtml(current.data.title)}</h2>
        ${current.children.filter(node => !node.deleted).map(section => `
          <section data-status="${escapeHtml(nodeStatus(payload, section.uuid) || 'in_agreement')}">
            <h3>${escapeHtml(section.data.title)}</h3>
            ${section.children.filter(node => !node.deleted).map(clause =>
              `<p data-status="${escapeHtml(nodeStatus(payload, clause.uuid) || 'in_agreement')}">${escapeHtml(clause.data.text)}</p>`
            ).join('')}
            <button class="add-clause" data-section="${escapeHtml(section.uuid)}">Add clause</button>
          </section>`).join('')}` : '';
      document.querySelectorAll('.add-clause').forEach(button => button.onclick = async () => {
        const text = prompt('Clause text');
        if (text) await api('/api/agreement/clauses/create', {section_uuid: button.dataset.section, text});
        await load();
      });
      renderSharing(payload);
    };
    // The whole page re-renders every 3s. Rebuilding the target list under a
    // user who is mid-selection would fight them, so leave the control alone
    // while it has focus and only replace options that actually differ.
    // A transient message must outlive the next poll, or feedback vanishes
    // before it can be read. The idle hint only reappears once it expires.
    let noteHoldUntil = 0;
    const renderSharing = (payload) => {
      const sharing = document.querySelector('#sharing');
      sharing.hidden = !current;
      if (!current) return;
      const select = document.querySelector('#target');
      if (document.activeElement === select) return;
      const wanted = [['', 'Not assigned'], ...(payload.channel_targets || [])
        .map(target => [target.id, target.name])];
      const shown = [...select.options].map(option => [option.value, option.textContent]);
      const same = shown.length === wanted.length
        && wanted.every(([value, label], index) =>
          shown[index][0] === value && shown[index][1] === label);
      if (!same) {
        select.replaceChildren(...wanted.map(([value, label]) => {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = label;
          return option;
        }));
      }
      select.value = payload.channel_target_id || '';
      document.querySelector('#copy-token').disabled = !select.value;
      if (Date.now() >= noteHoldUntil) {
        document.querySelector('#sharing-note').textContent = select.value
          ? '' : 'Assign a relay target to share this agreement.';
      }
    };
    const load = async () => render(await api('/api/agreement/document'));
    document.querySelector('#new-agreement').onclick = async () => {
      const title = prompt('Agreement title');
      if (title) await api('/api/agreement/agreements/create', {title});
      await load();
    };
    document.querySelector('#new-section').onclick = async () => {
      const title = prompt('Section title');
      if (title && current) await api('/api/agreement/sections/create', {agreement_uuid: current.uuid, title});
      await load();
    };
    document.querySelector('#agreements').onchange = async event => {
      await api('/api/agreement/agreements/select', {agreement_uuid: event.target.value});
      await load();
    };
    // Sharing goes through Core's channel-neutral routes only. This
    // application names no channel implementation beyond the mailbox target
    // it was given, which is what makes it a conformance proof.
    const note = message => {
      document.querySelector('#sharing-note').textContent = message;
      noteHoldUntil = Date.now() + 6000;
    };
    document.querySelector('#target').onchange = async event => {
      try {
        await api('/api/channels/mailbox/topics/assign', {
          topic_uuid: current.uuid, target_id: event.target.value || null,
        });
        await load();
        note(event.target.value ? 'Relay target assigned.' : 'Relay target removed.');
      } catch (error) { note(error.message); }
    };
    document.querySelector('#copy-token').onclick = async () => {
      try {
        const token = await api('/api/connect_token', {
          topic_uuids: [current.uuid],
          channel_options: {mailbox: {target_id: document.querySelector('#target').value}},
        });
        await navigator.clipboard.writeText(btoa(JSON.stringify(token)));
        note('Token copied to the clipboard.');
      } catch (error) { note(error.message); }
    };
    document.querySelector('#connect').onclick = async () => {
      const field = document.querySelector('#token');
      let token;
      try {
        token = JSON.parse(atob(field.value.trim()));
      } catch (error) {
        note('That is not a share token.');
        return;
      }
      // Core renamed this field to token_version so the connect token and the
      // channel descriptor stop both serializing a bare "version".
      if (token.token_version !== 1 || !Array.isArray(token.topic_uuids) || !token.topic_uuids.length) {
        note('Unrecognized token version.');
        return;
      }
      try {
        await api('/api/connect', {token});
        field.value = '';
        await load();
        note('Connected.');
      } catch (error) { note(error.message); }
    };
    load();
    setInterval(load, 3000);
  </script>
</body>
</html>
